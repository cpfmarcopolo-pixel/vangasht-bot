name: Vangasht Instagram bot

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "What to publish now"
        type: choice
        options: [s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, p1, p2, testcards, testreel, testrates, testvlog, test, story1, story2, story3, story4, post]
        default: testcards

permissions:
  contents: write

concurrency:
  group: vangasht-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "52 7 * * *")  echo "slot=story1" >> "$GITHUB_OUTPUT" ;;
            "48 13 * * *") echo "slot=story2" >> "$GITHUB_OUTPUT" ;;
            "48 16 * * *") echo "slot=post"   >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and fonts
        timeout-minutes: 20
        run: |
          pip install playwright==1.47.0 pillow pillow-heif
          # Ubuntu's download servers are sometimes slow: try 3 times, 6 minutes each, then go on without the extras
          for i in 1 2 3; do
            timeout 360 python -m playwright install --with-deps chromium && break
            echo "browser install attempt $i failed, retrying"; sleep 20
          done
          python -m playwright install chromium
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y fonts-noto-color-emoji || echo "emoji font skipped"

      - name: Make the image
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python bot.py render ${{ steps.slot.outputs.slot }}

      - name: Upload the image to this repository
        run: |
          git config user.name "vangasht-bot"
          git config user.email "bot@vangasht.com"
          git add out
          git commit -m "image ${{ steps.slot.outputs.slot }}" || true
          git push

      - name: Publish to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRONJOB_KEY: ${{ secrets.CRONJOB_KEY }}
        run: python bot.py publish

      - name: Save progress
        if: always()
        run: |
          git add out state.json || true
          git commit -m "published ${{ steps.slot.outputs.slot }}" || true
          git push || true
